@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center" (click)="onCancel()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-md mx-4 rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-xl" (click)="$event.stopPropagation()">
      <div class="p-5 border-b border-[var(--border)]">
        <h3 class="text-lg font-semibold text-[var(--foreground)]">{{ title }}</h3>
      </div>

      <div class="p-5">
        <p class="text-[var(--muted-foreground)]">{{ message }}</p>
      </div>

      <div class="p-4 pt-0 flex items-center justify-end gap-2">
        <a
          class="px-4 py-2 rounded-md border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:bg-[var(--accent)] transition-colors cursor-pointer"
          (click)="onCancel()"
        >
          {{ cancelText }}
        </a>
        <a
          class="px-4 py-2 rounded-md transition-colors cursor-pointer"
          [class]="destructive
            ? 'bg-[var(--destructive)] text-white hover:bg-[var(--destructive)]/90'
            : 'bg-[var(--primary)] text-white hover:opacity-90'"
          (click)="onConfirm()"
        >
          {{ confirmText }}
        </a>
      </div>
    </div>
  </div>
}
